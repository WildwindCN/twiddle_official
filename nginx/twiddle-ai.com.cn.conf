# twiddle-ai.com.cn — TwiddleSEED 官方主站
# 主域,直连 ECS (DNS-only, 灰色云). TLS 由本机 Let's Encrypt (DNS-01) 终止.
# 静态文件源: /opt/twiddle_official/web (由 git clone 拉取 main 分支).
# 部署流程: 本地 mirror push → GitHub → 服务器 `cd /opt/twiddle_official && git pull`,
#           同步 nginx 配置文件 `cp nginx/twiddle-ai.com.cn.conf /etc/nginx/sites-enabled/`.
#
# /api/* 反代到 127.0.0.1:8791 — 那是 twiddle-official-waitlist.service 起的 Node 进程,
# 仿 latent-space 把 API 收到 ECS 上的混部模式 (api-worker 是 Cloudflare Worker, 现在已
# 弃用, 见 latent-space/ecs-api 那一波迁移).

server {
    listen 80;
    server_name twiddle-ai.com.cn www.twiddle-ai.com.cn;
    return 301 https://$host$request_uri;
}

server {
    # 启用 HTTP/2 — 关键: 国内 RTT 200ms+ 走 HTTP/1.1 串行拉资源, HTTP/2 多路复用
    # 把首屏时间从 2-3s 压到 0.5-1s.
    listen 443 ssl http2;
    server_name twiddle-ai.com.cn www.twiddle-ai.com.cn;

    ssl_certificate     /etc/letsencrypt/live/twiddle-ai-com-cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/twiddle-ai-com-cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;

    # /api/* → waitlist Node 服务 (127.0.0.1:8791, systemd)
    location /api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # 其余全部走静态文件 — 直接 serve git checkout 出来的仓库根
    # (index.html / css / js / images / favicon 在仓库根, 其他目录 nginx deny 掉)
    root /opt/twiddle_official;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 压缩 text 类资源. 顶层 nginx.conf 的 gzip on 开了但 gzip_types 全注释,
    # 这里补上 text/css / application/javascript / application/json / image/svg+xml.
    # 经验值: CSS 20KB → ~5KB, JS 21KB → ~7KB.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;

    # 缓存图片 / 图标 / CSS / JS / 字体
    location ~* \.(jpg|jpeg|png|svg|webp|avif|gif|ico|css|js|woff2?|ttf|otf)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # favicon: 不打日志避免被扫
    location = /favicon.ico { access_log off; log_not_found off; }

    # 隐藏源仓库 / Functions 目录 / README
    location ~ /\.(git|gitignore) { deny all; return 404; }
    location ^~ /functions/ { deny all; return 404; }
    location ^~ /ecs-api/ { deny all; return 404; }
    location ^~ /deploy/ { deny all; return 404; }
    location = /README.md { deny all; return 404; }

    client_max_body_size 5M;

    access_log /var/log/nginx/twiddle-ai.com.cn.access.log;
    error_log  /var/log/nginx/twiddle-ai.com.cn.error.log;
}
