# Flock Voice on Spark, reached through the restricted Spark -> Gilmour
# reverse tunnel bound to 127.0.0.1:18090 on this host.

# One browser opens one long-lived audio WebSocket. Keep the trial within the
# measured four-client topology until a first-class waiting room is shipped.
limit_conn_zone $server_name zone=flock_audio_slots:10m;
limit_req_zone $binary_remote_addr zone=flock_bootstrap_rate:10m rate=2r/s;

server {
    listen 80;
    server_name flock.twiddle-ai.com.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name flock.twiddle-ai.com.cn;

    # Avoid Linux sendfile/TLS truncation on large static assets when this
    # shared :443 listener negotiates HTTP/2 through another virtual host.
    sendfile off;

    ssl_certificate /etc/letsencrypt/live/flock-twiddle-ai-com-cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flock-twiddle-ai-com-cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Serve the verified UI bytes on Gilmour. Sending dozens of first-paint
    # assets through one SSH forwarding connection can reset HTTP/2 streams.
    location = / {
        root /opt/flock-voice-ui/mvp;
        try_files /index.html =404;
        expires -1;
    }

    location = /index.html {
        root /opt/flock-voice-ui/mvp;
        expires -1;
    }

    location ^~ /src/ {
        alias /opt/flock-voice-ui/mvp/src/;
        expires 1h;
    }

    location ^~ /assets/ {
        alias /opt/flock-voice-ui/mvp/assets/;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;

        # The currently admitted runtime has a single exact canonical origin.
        # Gilmour is its public trust boundary and projects that origin inward.
        proxy_set_header Host localhost:8090;
        proxy_set_header Origin http://localhost:8090;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cloudflare adds forwarding headers at the edge; the runtime rejects
        # them by design, so terminate them at this trusted proxy boundary.
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/v1/audio {
        limit_conn flock_audio_slots 4;
        limit_conn_status 503;

        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8090;
        proxy_set_header Origin http://localhost:8090;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/v1/bootstrap {
        limit_req zone=flock_bootstrap_rate burst=4;

        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8090;
        proxy_set_header Origin http://localhost:8090;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_buffering off;
    }

    # Keep the operational readiness read browser-header-free.
    location = /readyz {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:8090;
        proxy_set_header Origin "";
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Port "";
        proxy_buffering off;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    access_log /var/log/nginx/flock.twiddle-ai.com.cn.access.log;
    error_log /var/log/nginx/flock.twiddle-ai.com.cn.error.log;
}
