<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数字存储测试</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 520px;
      margin: 60px auto;
      padding: 0 20px;
      color: #222;
    }
    h1 { font-size: 22px; }
    .row { display: flex; gap: 8px; margin: 16px 0; }
    input[type=number] {
      flex: 1;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 10px 18px;
      font-size: 16px;
      border: 0;
      border-radius: 6px;
      background: #f38020;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #msg { min-height: 1.4em; color: #555; font-size: 14px; }
    ul { padding-left: 18px; }
    li { margin: 4px 0; font-family: ui-monospace, monospace; }
    .muted { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <h1>数字存储测试（Cloudflare Pages + KV）</h1>

  <div class="row">
    <input id="num" type="number" placeholder="输入一个数字" />
    <button id="save">保存</button>
  </div>
  <div id="msg"></div>

  <h3>最近 20 条记录 <button id="refresh" style="background:#555;font-size:13px;padding:4px 10px;">刷新</button></h3>
  <ul id="list"><li class="muted">加载中…</li></ul>

<script>
const $ = (id) => document.getElementById(id);

async function save() {
  const v = $('num').value;
  if (v === '') { $('msg').textContent = '请先输入数字'; return; }
  $('save').disabled = true;
  $('msg').textContent = '保存中…';
  try {
    const r = await fetch('/api/numbers', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: Number(v) }),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || '保存失败');
    $('msg').textContent = `已保存 id=${data.id}, value=${data.value}`;
    $('num').value = '';
    load();
  } catch (e) {
    $('msg').textContent = '错误：' + e.message;
  } finally {
    $('save').disabled = false;
  }
}

async function load() {
  try {
    const r = await fetch('/api/numbers');
    const data = await r.json();
    const ul = $('list');
    if (!data.items || data.items.length === 0) {
      ul.innerHTML = '<li class="muted">（暂无记录）</li>';
      return;
    }
    ul.innerHTML = data.items.map(it =>
      `<li>${new Date(it.ts).toLocaleString()} — <b>${it.value}</b></li>`
    ).join('');
  } catch (e) {
    $('list').innerHTML = `<li class="muted">加载失败：${e.message}</li>`;
  }
}

$('save').addEventListener('click', save);
$('refresh').addEventListener('click', load);
$('num').addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
load();
</script>
</body>
</html>
